name: CI

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Sakilabo.Unishox2.sln

      # ContinuousIntegrationBuild normalizes source paths.
      # Without it, the absolute paths of the build machine end up in the pdb.
      - name: Build
        run: dotnet build Sakilabo.Unishox2.sln --no-restore -c Release -p:ContinuousIntegrationBuild=true

      # The normal CI run tests C# only. The upstream C comparison is a separate, explicitly requested check.
      - name: Test
        run: dotnet test tests/Sakilabo.Unishox2.Tests/Sakilabo.Unishox2.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Sakilabo.Unishox2/Sakilabo.Unishox2.csproj --no-build -c Release -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/package/release/*.nupkg
